<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholars Academy Admission Form</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f4f4}
.container{max-width:600px;margin:auto;background:white;padding:20px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,.1)}
h2{text-align:center}.form-group{margin-bottom:15px}.form-group label{display:block;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px;box-sizing:border-box}
.form-group textarea{resize:vertical}
.form-group button{display:block;width:100%;padding:10px;background:#007bff;border:0;color:white;font-size:16px;cursor:pointer;border-radius:5px}
.form-group button:hover{background:#0056b3}
</style>
</head>
<body>
<div class="container">
<h2>Admission Form - Scholars Academy</h2>
<form action="https://formspree.io/f/xnpngeev" method="POST">
<input type="hidden" name="_subject" value="New Scholars Academy Admission Application">
<div class="form-group"><label for="fullName">Full Name:</label><input type="text" id="fullName" name="fullName" required></div>
<div class="form-group"><label for="fatherName">Father's name:</label><input type="text" id="fatherName" name="fatherName" required></div>
<div class="form-group"><label for="dateOfBirth">Date of Birth:</label><input type="date" id="dateOfBirth" name="dateOfBirth" required></div>
<div class="form-group"><label for="gender">Gender:</label><select id="gender" name="gender" required><option value="" disabled selected>Select your gender</option><option value="male">Male</option><option value="female">Female</option></select></div>
<div class="form-group"><label for="email">Email Address:</label><input type="email" id="email" name="email" required></div>
<div class="form-group"><label for="phone">Phone Number:</label><input type="tel" id="phone" name="phone" required></div>
<div class="form-group"><label for="address">Address:</label><textarea id="address" name="address" rows="4" required></textarea></div>
<div class="form-group"><button type="submit">Submit</button></div>
</form>
</div>
</body>
</html>
